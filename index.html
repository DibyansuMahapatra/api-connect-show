<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>c-URL | Free URL Shortener</title>

    <meta
      name="description"
      content="c-URL is a fast, secure, and free URL shortener. Instantly convert long URLs into clean, shareable links with no account required."
    />

    <meta
      name="keywords"
      content="URL shortener, free URL shortener, shorten links, link shortener, short URL, URL generator"
    />

    <meta name="author" content="c-URL" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Canonical -->
    <link rel="canonical" href="https://c-url.pages.dev/" />

    <!-- Theme -->
    <meta name="theme-color" content="#6366f1" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="c-URL" />
    <meta property="og:title" content="c-URL | Free URL Shortener" />
    <meta
      property="og:description"
      content="Shorten long URLs instantly into clean, shareable links. Fast, secure, and completely free."
    />
    <meta property="og:url" content="https://c-url.pages.dev/" />
    <meta property="og:image" content="https://c-url.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="c-URL - Free URL Shortener" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="c-URL | Free URL Shortener" />
    <meta
      name="twitter:description"
      content="Shorten long URLs instantly into clean, shareable links."
    />
    <meta
      name="twitter:image"
      content="https://c-url.pages.dev/og-image.png"
    />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
